name: Sygnum source audit
on:
  push:
    branches: [feat/sygnum-brand]
    paths: [.github/workflows/sygnum-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pymupdf pillow requests
      - name: Inspect linked public material and package text sources
        run: |
          python <<'PY'
          import json, pathlib, collections, datetime, subprocess, zipfile, requests, fitz, io, hashlib
          from PIL import Image
          out=pathlib.Path('audit-artifact'); out.mkdir()
          report={'observedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':[]}
          url='https://www.sygnum.com/wp-content/uploads/2024/12/Sygnum-Crypto-Market-Outlook-2025-annual-report.pdf'
          try:
              r=requests.get(url,timeout=60)
              item={'url':url,'httpStatus':r.status_code,'contentType':r.headers.get('Content-Type')}
              report['sources'].append(item)
              if r.ok and r.content.startswith(b'%PDF'):
                  doc=fitz.open(stream=r.content,filetype='pdf')
                  item.update({'sha256':hashlib.sha256(r.content).hexdigest(),'pages':len(doc),'fonts':sorted({f[3] for p in doc for f in p.get_fonts()}),'metadata':doc.metadata})
                  colors=collections.Counter(); textstyles=collections.Counter()
                  for p in doc:
                      for d in p.get_drawings():
                          for k in ['fill','color']:
                              c=d.get(k)
                              if c and len(c)==3: colors['#'+''.join(f'{round(v*255):02X}' for v in c)]+=1
                      for block in p.get_text('dict')['blocks']:
                          for line in block.get('lines',[]):
                              for s in line.get('spans',[]): textstyles[(s['font'],round(s['size'],2),f'#{s["color"]:06X}')]+=1
                  item['vectorColors']=colors.most_common(35)
                  item['textStyles']=[{'font':k[0],'pt':k[1],'color':k[2],'count':v} for k,v in textstyles.most_common(30)]
                  for idx in [0,1,2,5,30]:
                      doc[idx].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(out/f'outlook-2025-page-{idx+1}.png')
              else: item['result']='Public download not accessible; no challenge bypass attempted.'
          except Exception as e: report['sources'].append({'url':url,'error':str(e)})
          url='https://mma.prnewswire.com/media/2099115/Sygnum_Logo.jpg'
          try:
              r=requests.get(url,timeout=30)
              item={'url':url,'httpStatus':r.status_code};report['sources'].append(item)
              if r.ok:
                  im=Image.open(io.BytesIO(r.content)).convert('RGB')
                  im.save(out/'press-logo.png')
                  item.update({'width':im.width,'height':im.height,'sha256':hashlib.sha256(r.content).hexdigest(),'colors':[(('#%02X%02X%02X'%rgb),count) for rgb,count in collections.Counter(im.getdata()).most_common(15)]})
          except Exception as e: report['sources'].append({'url':url,'error':str(e)})
          (out/'observations.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          with zipfile.ZipFile(out/'repo-text.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  p=pathlib.Path(name)
                  if p.suffix in {'.md','.mjs','.js','.jsx','.ts','.tsx','.json','.yaml','.yml','.css','.svg','.txt'} or p.name=='LICENSE': z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sygnum-source-evidence
          path: audit-artifact/
          retention-days: 3
