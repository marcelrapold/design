name: Refresh presentation references

on:
  push:
    branches:
      - dominicano-express

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore(reference): refresh generated previews')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils
      - run: npm ci
      - run: npm run deck:reference
      - name: Commit generated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/public
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(reference): refresh generated previews"
          git push
