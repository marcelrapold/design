name: Sygnum final visual verification
on:
  push:
    branches: [feat/sygnum-brand]
    paths: [.github/workflows/sygnum-final-qa.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep low-priority element defaults in the base layer
        run: |
          mkdir -p /tmp/sygnum-final
          python <<'PY'
          from pathlib import Path
          p=Path('apps/docs/app/globals.css')
          s=p.read_text()
          for rule in ('a{color:inherit}','button,select{font:inherit}','button,select,input,textarea{color:inherit}'):
              assert s.count(rule)==1, rule
              s=s.replace(rule,'@layer base{'+rule+'}')
          p.write_text(s)
          PY
      - run: npm ci
      - name: Tests, types and complete production build
        run: npm run check 2>&1 | tee /tmp/sygnum-final/check.log
      - name: Install browser
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps
      - name: Verify actual rendered button contrast, theme isolation and responsive layout
        run: |
          nohup npx --yes serve@14 apps/docs/out -l 4173 >/tmp/sygnum-final/server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/brand >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/brand >/dev/null
          cat >/tmp/sygnum-final/init.js <<'JS'
          window.__qaErrors=[];window.addEventListener('error',e=>window.__qaErrors.push(e.message));window.addEventListener('unhandledrejection',e=>window.__qaErrors.push(String(e.reason)));
          const original=console.error;console.error=(...a)=>{window.__qaErrors.push(a.map(String).join(' '));original.apply(console,a)};
          JS
          agent-browser open 'http://127.0.0.1:4173/praesentation?brand=sygnum' --init-script /tmp/sygnum-final/init.js
          agent-browser set viewport 1440 1000
          agent-browser wait '[data-brand=sygnum]'
          agent-browser wait --load networkidle
          cat >/tmp/sygnum-final/contrast.js <<'JS'
          (()=>{const lum=s=>{const x=s.match(/[\d.]+/g).slice(0,3).map(Number).map(v=>v/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return x[0]*.2126+x[1]*.7152+x[2]*.0722};const b=[...document.querySelectorAll('[data-slot=button]')].find(b=>b.textContent.includes('Auftrag kopieren'));if(!b)throw Error('copy action missing');const c=getComputedStyle(b),l1=lum(c.color),l2=lum(c.backgroundColor),r=(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);if(r<4.5)throw Error('Rendered button contrast '+r);if(window.__qaErrors.length)throw Error(window.__qaErrors.join(';'));return {brand:document.querySelector('[data-brand]').dataset.brand,foreground:c.color,background:c.backgroundColor,contrast:r}})()
          JS
          for brand in sygnum goldbach neutral; do
            agent-browser select '#brand-choice' "$brand"
            agent-browser wait "[data-brand=$brand]"
            agent-browser eval --stdin </tmp/sygnum-final/contrast.js | tee -a /tmp/sygnum-final/contrast-results.txt
          done
          agent-browser select '#brand-choice' sygnum
          agent-browser screenshot /tmp/sygnum-final/sygnum-presentations.png
          agent-browser open 'http://127.0.0.1:4173/brand?brand=sygnum'
          agent-browser wait '.sygnum-hero'
          agent-browser wait --load networkidle
          agent-browser screenshot /tmp/sygnum-final/sygnum-desktop.png --full
          agent-browser eval '(()=>{if(window.__qaErrors.length)throw Error(window.__qaErrors.join(";"));if([...document.images].some(i=>!i.complete||i.naturalWidth===0))throw Error("broken asset");return "assets and errors PASS"})()'
          agent-browser set viewport 390 844
          agent-browser screenshot /tmp/sygnum-final/sygnum-mobile.png --full
          agent-browser eval '(()=>{if(document.documentElement.scrollWidth>innerWidth+1)throw Error("mobile overflow");return "mobile PASS"})()'
          agent-browser select '#brand-choice' neutral
          agent-browser eval '(()=>{if(document.querySelector(".sygnum-hero"))throw Error("Sygnum leaked into default");return "isolation PASS"})()'
          agent-browser set viewport 1440 1000
          agent-browser open 'http://127.0.0.1:4173/mermaid?brand=sygnum'
          agent-browser wait --load networkidle
          agent-browser screenshot /tmp/sygnum-final/sygnum-mermaid.png
          agent-browser eval '(()=>{if(!document.querySelector("[data-brand=sygnum]"))throw Error("wrong brand");if(document.body.innerText.includes("Syntax error")||window.__qaErrors.length)throw Error("diagram errors");return "Mermaid PASS"})()'
          agent-browser close
      - name: Package and commit verified source
        run: |
          python <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/sygnum-final/Sygnum-Design-Stack.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder,prefix in [('brands/sygnum','source'),('apps/docs/public/brands/sygnum','exports')]:
                  for p in Path(folder).rglob('*'):
                      if p.is_file() and p.suffix.lower() not in {'.woff','.woff2','.ttf','.otf','.eot'}:z.write(p,str(Path(prefix)/p.relative_to(folder)))
          PY
          rm .github/workflows/sygnum-final-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): keep button foreground and link contrast intact in every brand'
          git push origin HEAD:feat/sygnum-brand
          git rev-parse HEAD >/tmp/sygnum-final/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sygnum-final-verified
          path: /tmp/sygnum-final
          retention-days: 3
