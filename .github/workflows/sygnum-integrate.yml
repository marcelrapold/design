name: Sygnum integration and visual QA
on:
  push:
    branches: [feat/sygnum-brand]
    paths: [.github/workflows/sygnum-integrate.yml]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sygnum-brand
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct and save source import
        run: |
          mkdir -p /tmp/sygnum-qa
          python <<'PY'
          from pathlib import Path
          p=Path('apps/docs/app/_components/sygnum-showcase.tsx')
          p.write_text(p.read_text().replace('../../../../../brands/sygnum/sources/sources.json','../../../../brands/sygnum/sources/sources.json'))
          assert (p.parent/'../../../../brands/sygnum/sources/sources.json').resolve().is_file()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/docs/app/_components/sygnum-showcase.tsx
          git diff --cached --quiet || git commit -m 'fix(sygnum): resolve research manifest relative to workspace root'
          git push origin HEAD:feat/sygnum-brand
      - name: Install build and document tools
        run: |
          npm ci
          npm audit --json > /tmp/sygnum-qa/dependency-audit.json || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils
      - name: Generate contracts and reference renders
        run: |
          npm run contracts
          npm run deck:reference 2>&1 | tee /tmp/sygnum-qa/render.log
      - name: Full tests, types and production build
        run: npm run check 2>&1 | tee /tmp/sygnum-qa/check.log
      - name: Install browser verification CLI
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps
          agent-browser --version > /tmp/sygnum-qa/browser-version.txt
      - name: Verify pages, responsive layout and brand isolation
        timeout-minutes: 4
        run: |
          test -f apps/docs/out/brand.html
          nohup npx --yes serve@14 apps/docs/out -l 4173 >/tmp/sygnum-qa/server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/brand >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/brand >/dev/null
          cat >/tmp/sygnum-qa/init.js <<'JS'
          window.__qaErrors=[];window.addEventListener('error',e=>window.__qaErrors.push(e.message));window.addEventListener('unhandledrejection',e=>window.__qaErrors.push(String(e.reason)));
          const original=console.error;console.error=(...args)=>{window.__qaErrors.push(args.map(String).join(' '));original.apply(console,args)};
          JS
          agent-browser open 'http://127.0.0.1:4173/brand?brand=sygnum' --init-script /tmp/sygnum-qa/init.js
          agent-browser set viewport 1440 1000
          agent-browser wait '.sygnum-hero'
          agent-browser wait --load networkidle
          agent-browser snapshot -i > /tmp/sygnum-qa/desktop-snapshot.txt
          agent-browser screenshot /tmp/sygnum-qa/sygnum-desktop.png --full
          agent-browser eval '(()=>{if(!document.querySelector("[data-brand=sygnum]"))throw Error("wrong brand");if(document.documentElement.scrollWidth>innerWidth+1)throw Error("horizontal overflow");if(window.__qaErrors.length)throw Error(window.__qaErrors.join(";"));if([...document.images].some(i=>!i.complete||i.naturalWidth===0))throw Error("broken image");return "desktop PASS"})()'
          agent-browser select '#brand-choice' neutral
          agent-browser wait '[data-brand=neutral]'
          agent-browser eval '(()=>{if(document.querySelector(".sygnum-hero"))throw Error("brand content leaked");return "default isolation PASS"})()'
          agent-browser select '#brand-choice' goldbach
          agent-browser wait '[data-brand=goldbach]'
          agent-browser eval '(()=>{if(document.querySelector(".sygnum-hero"))throw Error("brand isolation failed");return "goldbach isolation PASS"})()'
          agent-browser screenshot /tmp/sygnum-qa/goldbach-regression.png
          agent-browser select '#brand-choice' sygnum
          agent-browser wait '.sygnum-hero'
          agent-browser set viewport 390 844
          agent-browser screenshot /tmp/sygnum-qa/sygnum-mobile.png --full
          agent-browser eval '(()=>{if(document.documentElement.scrollWidth>innerWidth+1)throw Error("mobile overflow");return "mobile PASS"})()'
          agent-browser set viewport 1440 1000
          agent-browser open 'http://127.0.0.1:4173/praesentation?brand=sygnum'
          agent-browser wait --load networkidle
          agent-browser screenshot /tmp/sygnum-qa/sygnum-presentations.png
          agent-browser eval '(()=>{if(!document.querySelector("[data-brand=sygnum]"))throw Error("presentation brand");if(document.querySelector("[data-nextjs-dialog]"))throw Error("error overlay");return "presentation PASS"})()'
          agent-browser open 'http://127.0.0.1:4173/mermaid?brand=sygnum'
          agent-browser wait --load networkidle
          agent-browser snapshot -i > /tmp/sygnum-qa/mermaid-snapshot.txt
          agent-browser screenshot /tmp/sygnum-qa/sygnum-mermaid.png
          agent-browser eval '(()=>{if(!document.querySelector("[data-brand=sygnum]"))throw Error("diagram brand");if(document.body.innerText.includes("Syntax error"))throw Error("Mermaid error");return "mermaid PASS"})()'
          agent-browser close
          echo 'Desktop, mobile, logo, theme isolation, presentation and Mermaid smoke checks passed.' > /tmp/sygnum-qa/result.txt
      - name: Package deliverables without font files
        run: |
          python <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/sygnum-qa/Sygnum-Design-Stack.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder,prefix in [('brands/sygnum','source'),('apps/docs/public/brands/sygnum','exports')]:
                  for p in Path(folder).rglob('*'):
                      if p.is_file() and p.suffix.lower() not in {'.woff','.woff2','.ttf','.otf','.eot'}:
                          z.write(p,str(Path(prefix)/p.relative_to(folder)))
          PY
      - name: Commit references and remove temporary transport
        run: |
          rm -f .github/sygnum-install.*.b64 .github/workflows/sygnum-source-audit.yml .github/workflows/sygnum-integrate.yml
          git add -A
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'test(sygnum): publish verified reference renders and remove integration scaffolding'
          git push origin HEAD:feat/sygnum-brand
          git rev-parse HEAD > /tmp/sygnum-qa/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sygnum-build-and-visual-qa
          path: /tmp/sygnum-qa/
          retention-days: 3
