name: Check and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://design.rapold.io
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      VERCEL_GIT_COMMIT_REF: main
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret: $key. See docs/deployment.md."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check current main commit
        shell: bash
        run: |
          latest_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::This run is no longer the latest main commit. Deploy the newest run instead."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.16.0
      - name: Read existing production project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build and validate Vercel production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy validated artifact
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=main
      - name: Verify production commit and routes
        run: node scripts/verify-deployment.mjs https://design.rapold.io "$GITHUB_SHA"
